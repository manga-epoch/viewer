<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="700" height="380" fill="url(#bg2)" rx="12"/>

  <text x="350" y="32" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="2">チューリングテスト（模倣ゲーム）1950</text>

  <!-- Room divider (wall) -->
  <rect x="345" y="60" width="10" height="220" fill="#334155" rx="3"/>
  <text x="350" y="300" text-anchor="middle" fill="#475569" font-size="11">── 壁（テキストのみ通過） ──</text>

  <!-- Interrogator (left) -->
  <circle cx="170" cy="140" r="45" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="132" text-anchor="middle" fill="#e2e8f0" font-size="28">👤</text>
  <text x="170" y="155" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">審査員</text>
  <text x="170" y="205" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">審査員（人間）</text>
  <text x="170" y="222" text-anchor="middle" fill="#64748b" font-size="10">相手が人間か機械か</text>
  <text x="170" y="237" text-anchor="middle" fill="#64748b" font-size="10">判定する</text>

  <!-- Candidate A (human, top-right) -->
  <circle cx="520" cy="105" r="38" fill="#1a2e1a" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="98" text-anchor="middle" fill="#e2e8f0" font-size="24">🧑</text>
  <text x="520" y="116" text-anchor="middle" fill="#86efac" font-size="9" font-weight="600">A</text>
  <text x="520" y="157" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">候補A: 人間</text>

  <!-- Candidate B (machine, bottom-right) -->
  <circle cx="520" cy="210" r="38" fill="#2a1a2e" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="203" text-anchor="middle" fill="#e2e8f0" font-size="24">🤖</text>
  <text x="520" y="221" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="600">B</text>
  <text x="520" y="262" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">候補B: 機械</text>

  <!-- Chat arrows -->
  <path d="M215,125 L345,105" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M355,105 L482,100" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M215,155 L345,190" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <path d="M355,190 L482,200" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Chat bubbles -->
  <rect x="230" y="85" width="100" height="25" rx="10" fill="#1e3a5f"/>
  <text x="280" y="102" text-anchor="middle" fill="#93c5fd" font-size="10">好きな本は？</text>

  <rect x="395" y="72" width="80" height="25" rx="10" fill="#1a2e1a"/>
  <text x="435" y="89" text-anchor="middle" fill="#86efac" font-size="10">源氏物語</text>

  <rect x="230" y="175" width="100" height="25" rx="10" fill="#1e3a5f"/>
  <text x="280" y="192" text-anchor="middle" fill="#93c5fd" font-size="10">好きな本は？</text>

  <rect x="390" y="185" width="90" height="25" rx="10" fill="#2a1a2e"/>
  <text x="435" y="202" text-anchor="middle" fill="#c084fc" font-size="10">走れメロス</text>

  <!-- Result box -->
  <rect x="70" y="315" width="560" height="48" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="337" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">判定: 審査員がAとBを区別できない → 機械は「知能がある」</text>
  <text x="350" y="354" text-anchor="middle" fill="#64748b" font-size="10">※ 内面の「意識」は問わない。外部から観測可能な「振る舞い」だけで判断する（行動主義）</text>
</svg>
