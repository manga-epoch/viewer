<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="340" fill="url(#bg)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">AI前史 → ダートマス会議への3つの潮流</text>

  <!-- Timeline axis -->
  <line x1="60" y1="190" x2="840" y2="190" stroke="#334155" stroke-width="2"/>
  <!-- Ticks -->
  <line x1="120" y1="185" x2="120" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="215" text-anchor="middle" fill="#64748b" font-size="11">1936</text>
  <line x1="280" y1="185" x2="280" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="280" y="215" text-anchor="middle" fill="#64748b" font-size="11">1943</text>
  <line x1="410" y1="185" x2="410" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" fill="#64748b" font-size="11">1948</text>
  <line x1="540" y1="185" x2="540" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="215" text-anchor="middle" fill="#64748b" font-size="11">1950</text>
  <line x1="730" y1="185" x2="730" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="215" text-anchor="middle" fill="#64748b" font-size="11">1956</text>

  <!-- Stream 1: Mathematical Logic (top) -->
  <rect x="70" y="60" width="160" height="56" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="82" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">数理論理学</text>
  <text x="150" y="100" text-anchor="middle" fill="#64748b" font-size="10">チューリング機械 (1936)</text>
  <text x="150" y="112" text-anchor="middle" fill="#64748b" font-size="9">「何が計算可能か」</text>
  <line x1="150" y1="116" x2="150" y2="185" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stream 2: Neuroscience (top-right) -->
  <rect x="210" y="60" width="190" height="56" rx="8" fill="#1e3a3f" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="305" y="82" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="600">神経科学</text>
  <text x="305" y="100" text-anchor="middle" fill="#64748b" font-size="10">McCulloch-Pitts ニューロン (1943)</text>
  <text x="305" y="112" text-anchor="middle" fill="#64748b" font-size="9">「脳はネットワークで計算する」</text>
  <line x1="305" y1="116" x2="280" y2="185" stroke="#14b8a6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stream 3: Information Theory -->
  <rect x="350" y="120" width="170" height="56" rx="8" fill="#3b1f3f" stroke="#a855f7" stroke-width="1.5"/>
  <text x="435" y="142" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">情報理論</text>
  <text x="435" y="158" text-anchor="middle" fill="#64748b" font-size="10">シャノン (1948)</text>
  <text x="435" y="170" text-anchor="middle" fill="#64748b" font-size="9">「情報は数学で扱える」</text>
  <line x1="435" y1="176" x2="410" y2="185" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Turing Test -->
  <rect x="480" y="120" width="170" height="56" rx="8" fill="#3f2a1e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="565" y="142" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">チューリングテスト</text>
  <text x="565" y="158" text-anchor="middle" fill="#64748b" font-size="10">模倣ゲーム (1950)</text>
  <text x="565" y="170" text-anchor="middle" fill="#64748b" font-size="9">「知能の判定基準」</text>
  <line x1="565" y1="176" x2="540" y2="185" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Dartmouth (big, glowing) -->
  <rect x="640" y="55" width="210" height="125" rx="12" fill="#1a1a2e" stroke="#f97316" stroke-width="2.5" filter="url(#glow)"/>
  <text x="745" y="82" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="700">ダートマス会議</text>
  <text x="745" y="102" text-anchor="middle" fill="#e2e8f0" font-size="11">1956年 夏</text>
  <text x="745" y="122" text-anchor="middle" fill="#94a3b8" font-size="10">「人工知能」の命名</text>
  <text x="745" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">McCarthy, Minsky,</text>
  <text x="745" y="155" text-anchor="middle" fill="#94a3b8" font-size="10">Rochester, Shannon</text>
  <text x="745" y="175" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">「知能は計算で再現できる」</text>

  <!-- Convergence arrows -->
  <path d="M230,116 Q400,160 640,120" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <path d="M400,176 Q520,195 640,150" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <path d="M650,176 Q680,200 640,165" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Two branches from Dartmouth -->
  <line x1="690" y1="180" x2="350" y2="275" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="800" y1="180" x2="600" y2="275" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="220" y="255" width="200" height="48" rx="8" fill="#2a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="320" y="276" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">記号主義 (Symbolic AI)</text>
  <text x="320" y="294" text-anchor="middle" fill="#64748b" font-size="10">ルールを人が書く → エキスパートシステム</text>

  <rect x="480" y="255" width="220" height="48" rx="8" fill="#0a2a1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="590" y="276" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">結合主義 (Connectionism)</text>
  <text x="590" y="294" text-anchor="middle" fill="#64748b" font-size="10">ニューロンを模倣 → DL / Transformer / GPT</text>

  <!-- Arrow showing future -->
  <text x="750" y="320" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">→ 次章: パーセプトロン (1957)</text>
</svg>
