<title>アクセスコードで開く — EPOCH</title>
<!--
  なぜこの方式か（business/system_architecture.md 第2節 Phase 1）:
  静的ホスティングでは「コードを JS で照合して表示/非表示」は**ソースを見れば破れる**ため意味がない。
  そこで **コードから解錠先の URL を導出**する。コンテンツは推測不能なパスに置き、
  パスそのものを秘密にする。コードを知る人だけがそのパスを計算できる。

  - 破られ方: パスを知った人が他人に共有する（＝コード共有と同じ）。個人規模では許容圏と
    設計文書が判断している。個別失効が必要になったら Phase 2（per-user 認証）へ。
  - コードは Arc ごとに 1 つ。BOOTH のダウンロード商品で購入者へ配布する。
-->
<style>
:root{--bg:#FAFAF7;--surface:#F4F2EC;--border:#E4E1D8;--ink:#1A1A1A;--ink-sub:#565248;--link:#3f6178;--bad:#b4493f;--radius:10px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
 background:var(--bg);color:var(--ink);line-height:1.9;
 font-family:"Inter","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.card{width:100%;max-width:520px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:38px 34px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-sub)}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:10px 0 6px}
p.lead{color:var(--ink-sub);font-size:14.5px;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--border);border-radius:var(--radius);
 background:var(--bg);color:var(--ink);font-family:inherit;letter-spacing:.06em}
input:focus{outline:2px solid var(--link);outline-offset:1px}
button{margin-top:16px;width:100%;padding:15px;border:0;border-radius:var(--radius);background:var(--ink);color:var(--bg);
 font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:16px;font-size:13.5px;min-height:1.4em}
.msg.err{color:var(--bad)}
.note{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-sub)}
.note a{color:var(--link)}
.go-btn{display:inline-block;padding:11px 20px;background:#1A1A1A;color:#FAFAF7;border-radius:9px;text-decoration:none;font-weight:700;font-size:14px}
.go-btn.ghost{background:#fff;color:#1A1A1A;border:1.5px solid #1A1A1A}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">EPOCH</div>
  <h1>アクセスコードで開く</h1>
  <p class="lead">ご購入時にお渡ししたアクセスコードを入力してください。</p>

  <label for="code">アクセスコード</label>
  <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
         placeholder="EPOCH-A2-XXXXXXXX">
  <button id="go">開く</button>
  <div class="msg" id="msg"></div>

  <div class="note">
    コードが見つからない場合や、開けない場合は
    <a href="pub/epoch/arc2/legal.html#contact">お問い合わせ</a> ください。<br>
    第 1 巻「黎明」は <a href="pub/epoch/arc1/">無料でお読みいただけます</a>。
  </div>
</div>

<script>
// ⚠ コードの照合は**サーバ側**で行う（Cloudflare Pages の _worker.js）。
// 以前はここでコードから解錠先パスを計算して飛ぶだけで、誰も何も確かめていなかった。
// パスさえ知っていればコード無しで読めてしまい、実際に公開リポジトリがその
// パスを一覧表示していたため到達できた（2026-09-02 実測）。
// いまは /gate にコードを送り、合っていればサーバがクッキーを付け、解錠先を返す。
// 解錠先パスはサーバが持つので、ここには書かない（＝ページを読んでも分からない）。
const $ = id => document.getElementById(id);
async function unlock() {
  const msg = $("msg"); msg.className = "msg"; msg.textContent = "確認しています…";
  $("go").disabled = true;
  const code = ($("code").value || "").trim();
  if (!code) { msg.className = "msg err"; msg.textContent = "コードを入力してください。"; $("go").disabled = false; return; }
  try {
    const r = await fetch("/gate?c=" + encodeURIComponent(code), { cache: "no-store" });
    const d = await r.json();
    if (d && d.ok && d.path) {
      // 体験版で第 1 話を読み終えている人が多い（読者指摘）。強制で頭から
      // 開かず、「続きから」を第一候補にした 2 択を出す。#s2 はシーン 2 の頭。
      msg.className = "msg";
      msg.innerHTML = 'コードを確認しました。'
        + '<span style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">'
        + '<a class="go-btn" href="' + d.path + 'index.html#s2">第 2 話から続きを読む →</a>'
        + '<a class="go-btn ghost" href="' + d.path + '">最初から読む</a></span>';
      $("go").style.display = "none";
      return;
    }
  } catch (e) { /* 通信できないときも「確認できなかった」と同じ扱い */ }
  msg.className = "msg err";
  msg.textContent = "コードが確認できませんでした。入力をお確かめください。";
  $("go").disabled = false;
}

$("go").addEventListener("click", unlock);
$("code").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

// ?c=CODE 付きで来たら、入れて開くところまで自動でやる。
// なぜ要るか: コードは推測されないよう長くしてあるので、毎回打つのが現実的でない
// （制作中のスマホ確認で毎回詰まった）。リンクをブックマークすれば以後 1 タップ。
// 購入者にも「このリンクを開くだけ」で渡せる。
//
// ⚠ 鍵の強さは変えていない。リンクを渡すのはコードを渡すのと同じで、
//   もともと設計が織り込んでいる範囲（business/system_architecture.md 第2節）。
// ⚠ 確認できたらアドレス欄からコードを消す。画面共有やスクショで
//   URL ごと流れるのを避けるため（ブックマーク側には残る）。
(function () {
  const c = new URLSearchParams(location.search).get("c");
  if (!c) return;
  $("code").value = c;
  history.replaceState(null, "", location.pathname);
  unlock();
})();
</script>
</body>
</html>
